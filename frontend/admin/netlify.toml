[[redirects]]
  from = "/api/*"
  to = "https://hotel-qr-wygt.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://hotel-qr-wygt.onrender.com/uploads/:splat"
  status = 200
  force = true

# Single-page app fallback: serve the dashboard shell for client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
