# Netlify config for the WAGA BITS management dashboard.
# The site's Base directory in Netlify settings must be "frontend/admin".
#
# Replace the backend host in the two redirect targets below with the exact
# origin of the Render API (no trailing slash), e.g. https://my-api.onrender.com

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# API and uploaded files are proxied to the Render backend so every request
# stays same-origin: the session cookie is SameSite=Lax and is only accepted
# on the dashboard's own domain, so the browser must talk to itself while the
# server-side proxy forwards to Render in secret.
[[redirects]]
  from = "/api/*"
  to = "https://hotel-qr-1.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://hotel-qr-1.onrender.com/uploads/:splat"
  status = 200
  force = true

# Single-page app fallback: any other path serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
