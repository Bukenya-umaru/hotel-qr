# Netlify config for the WAGA BITS project (repo root).
# Built at the repo root with npm workspaces; each workspace keeps its own
# dist folder, so the publish paths are written out in full from the root.
#
# Proxy /api/* and /uploads/* through the backend-proxy Netlify Function.
# The function reads the Render backend origin from the BACKEND_URL
# environment variable configured in the Netlify site settings — the
# URL is never committed to this repo. Same-origin requests keep the
# session cookie SameSite=Lax on the dashboard's own domain.

[build]
  command = "npm run build:admin"
  publish = "frontend/admin/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/backend-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/backend-proxy"
  status = 200
  force = true

# Single-page app fallback: any other path serves the dashboard's app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
